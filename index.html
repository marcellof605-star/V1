<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blokland</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="info"></div>
    <div id="topbtns">
      <button class="chip" id="flyBtn" type="button">Terbang</button>
      <button class="chip" id="menuBtn" type="button">Menu</button>
    </div>
    <div id="cross"></div>
    <div id="toast"></div>
  </div>

  <div id="touch" hidden>
    <div id="stickZone">
      <div id="stickBase"><div id="stickKnob"></div></div>
    </div>
    <div id="actions">
      <button class="act" id="placeBtn" type="button">Taruh</button>
      <button class="act" id="breakBtn" type="button">Hancurkan</button>
      <button class="act" id="downBtn" type="button" hidden>Turun</button>
      <button class="act big" id="jumpBtn" type="button">Lompat</button>
    </div>
  </div>

  <div id="hotbar"><div class="bar" id="bar"></div></div>

  <div id="overlay">
    <div class="panel">
