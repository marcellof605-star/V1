<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blokland - Ultimate</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <style>
[hidden] { display: none !important; }
  :root {
    --ink: #121d17;
    --panel: rgba(16, 26, 20, 0.92);
    --edge: #3f5b49;
    --text: #eef3e6;
    --muted: #aebdad;
    --accent: #f2b134;
    --grass: #5fa83b;
    --grass-dark: #3f7a27;
    --dirt: #865c3a;
    --sand: #dacd92;
    --stone: #8d928f;
    --stone-dark: #5f6461;
    --display: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --hb: 68px;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 15px/1.45 var(--body);
    overflow: hidden;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #view { display: block; width: 100%; height: 100%; background: var(--ink); }

  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #info {
    position: absolute; top: 14px; left: 16px;
    font: 500 14px/1.3 var(--display);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7), 0 0 6px rgba(0, 0, 0, 0.5);
  }
  #stats {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; font: 700 12px var(--display); text-shadow: 1px 1px 0 #000;
  }
  .stat-bar { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.6); padding: 4px 10px; border: 2px solid #0b110d; }
  .bar-fill { height: 8px; width: 70px; background: #222; border: 1px solid #000; }
  .bar-fill i { display: block; height: 100%; transition: width 0.2s; }
  #hpFill { background: #e74c3c; width: 100%; }
  #foodFill { background: #e67e22; width: 100%; }

  #topbtns { position: absolute; top: 10px; right: 16px; display: flex; gap: 8px; pointer-events: auto; }
  .chip {
    font: 700 14px var(--display);
    color: #fff;
    background: #3b4a40;
    border: 3px solid #0b110d;
    padding: 6px 12px;
    min-height: 42px;
    box-shadow: inset 0 -4px 0 #26332a, inset 0 3px 0 #61796a, 3px 3px 0 rgba(0, 0, 0, 0.5);
    text-shadow: 2px 2px 0 #000;
    cursor: pointer;
  }
  .chip:active { transform: translate(2px, 2px); box-shadow: inset 0 -2px 0 #26332a, inset 0 2px 0 #61796a, 1px 1px 0 rgba(0, 0, 0, 0.5); }
  .chip.on { background: var(--accent); color: #231a05; text-shadow: none; box-shadow: inset 0 -4px 0 #b57f12, inset 0 3px 0 #ffd77a, 3px 3px 0 rgba(0, 0, 0, 0.5); }
  .chip:focus-visible, .btn:focus-visible, .slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #wet { position: absolute; inset: 0; background: rgba(30, 90, 190, 0.38); }
  #cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; mix-blend-mode: difference; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; }
  #cross::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #cross::after { left: 0; top: 10px; width: 22px; height: 2px; }
  #toast {
    position: absolute; left: 0; right: 0; bottom: calc(var(--hb) + 10px);
    text-align: center;
    font: 700 17px var(--display);
    letter-spacing: 0.04em;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
    opacity: 0; transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }

  /* Hotbar */
  #hotbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px 10px; pointer-events: none; }
  .bar { position: relative; display: flex; gap: 4px; width: min(100%, 428px); margin: 0 auto; pointer-events: auto; }
  .slot {
    position: relative; flex: 1 1 0; min-width: 0; aspect-ratio: 1; max-height: 48px;
    padding: 0; display: grid; place-items: center;
    background: #2a3a30;
    border: 4px solid #0b110d;
    box-shadow: inset 0 0 0 2px #4d6355;
    cursor: pointer;
  }
  .slot img, .islot img { width: 78%; height: auto; image-rendering: pixelated; pointer-events: none; }
  .slot .num {
    position: absolute; left: 3px; top: 1px;
    font: 700 10px var(--display); color: var(--muted);
    pointer-events: none;
  }
  .slot.sel { background: #566d5b; box-shadow: inset 0 0 0 3px var(--accent), 0 0 0 2px #fff3d0; }
  .slot.sel .num { color: var(--accent); }
  body.touch .slot .num { display: none; }

  /* Touch controls */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #dpad {
    position: absolute; left: 16px; bottom: calc(var(--hb) + 16px);
    display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px;
    pointer-events: none;
  }
  .dp {
    --ar: #fff;
    position: relative; padding: 0; pointer-events: auto; touch-action: none;
    background: #3b4a40;
    border: 4px solid #0b110d;
    box-shadow: inset 0 -4px 0 #26332a, inset 0 3px 0 #61796a, 3px 3px 0 rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }
  .dp::before { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: translate(-50%, -50%); border-style: solid; }
  .dp.on { --ar: #231a05; background: var(--accent); transform: translate(2px, 2px); box-shadow: inset 0 -4px 0 #b57f12, inset 0 3px 0 #ffd77a, 1px 1px 0 rgba(0, 0, 0, 0.5); }
  #dpUp { grid-column: 2; grid-row: 1; }
  #dpLeft { grid-column: 1; grid-row: 2; }
  #dpJump { grid-column: 2; grid-row: 2; }
  #dpRight { grid-column: 3; grid-row: 2; }
  #dpDown { grid-column: 2; grid-row: 3; }
  #dpUp::before { border-width: 0 10px 14px 10px; border-color: transparent transparent var(--ar) transparent; }
  #dpDown::before { border-width: 14px 10px 0 10px; border-color: var(--ar) transparent transparent transparent; }
  #dpLeft::before { border-width: 10px 14px 10px 0; border-color: transparent var(--ar) transparent transparent; }
  #dpRight::before { border-width: 10px 0 10px 14px; border-color: transparent transparent transparent var(--ar); }
  #dpJump { font: 700 10px var(--display); color: var(--ar); text-shadow: 1px 1px 0 #000; }
  #dpJump.on { text-shadow: none; }
  #dpJump::before { display: none; }
  #actions {
    position: absolute; right: 16px; bottom: calc(var(--hb) + 16px);
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    pointer-events: none;
  }
  .act {
    pointer-events: auto; touch-action: none;
    width: 96px; height: 50px; padding: 0;
    font: 700 14px var(--display); letter-spacing: 0.03em; color: #fff;
    background: #3b4a40;
    border: 4px solid #0b110d;
    box-shadow: inset 0 -5px 0 #26332a, inset 0 4px 0 #61796a, 4px 4px 0 rgba(0, 0, 0, 0.5);
    text-shadow: 2px 2px 0 #000;
    cursor: pointer;
  }
  .act.on { background: var(--accent); color: #231a05; text-shadow: none; transform: translate(2px, 2px); box-shadow: inset 0 -5px 0 #b57f12, inset 0 4px 0 #ffd77a, 2px 2px 0 rgba(0, 0, 0, 0.5); }
  .act.big { height: 58px; }

  /* Menu */
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(8, 14, 10, 0.66);
  }
  .panel {
    width: min(100%, 470px); max-height: 100%; overflow-y: auto;
    padding: 20px;
    background: var(--panel);
    border: 4px solid #0b110d;
    box-shadow: inset 0 0 0 3px #4d6355, 6px 6px 0 rgba(0, 0, 0, 0.5);
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel h1 { margin: 0; font: 700 42px/1 var(--display); letter-spacing: 0.02em; color: var(--accent); text-wrap: balance; }
  .strip { display: flex; height: 8px; }
  .strip i { flex: 1; }
  .lead { margin: 0; color: var(--muted); max-width: 60ch; }
  .btn {
    font: 700 17px var(--display); color: #fff;
    background: #8d928f;
    border: 4px solid #0b110d; padding: 10px 18px; min-height: 52px;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.3), inset 0 4px 0 rgba(255, 255, 255, 0.32), 4px 4px 0 rgba(0, 0, 0, 0.5);
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }
  .btn.primary { background: #5fa83b; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translate(3px, 3px); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3), inset 0 3px 0 rgba(255, 255, 255, 0.32), 1px 1px 0 rgba(0, 0, 0, 0.5); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .btn { min-width: 0; padding-inline: 10px; }
  .help { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .help section { min-width: 0; }
  .help h2 { margin: 0 0 4px; font: 700 14px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .help ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .help li + li { margin-top: 2px; }

  .cnt {
    position: absolute; right: 2px; bottom: 0;
    font: 700 11px var(--display); color: #fff; text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }
  .islot .num { position: absolute; left: 3px; top: 1px; font: 700 9px var(--display); color: var(--muted); pointer-events: none; }
  #inv { position: absolute; inset: 0; z-index: 11; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 14, 10, 0.72); }
  .invpanel { gap: 10px; }
  .invpanel h2 { margin: 0; font: 700 22px var(--display); color: var(--accent); }
  .invpanel h3 { margin: 0; font: 700 12px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
  .islot {
    position: relative; min-width: 0; aspect-ratio: 1; padding: 0; display: grid; place-items: center;
    background: #2a3a30; border: 3px solid #0b110d; box-shadow: inset 0 0 0 2px #4d6355; cursor: pointer;
  }
  .islot:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .islot.sel { background: #566d5b; box-shadow: inset 0 0 0 2px var(--accent); }
  .recipes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px; }
  .recipe {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 42px; padding: 4px 8px; text-align: left;
    font: 700 13px var(--display); color: #fff;
    background: #2a3a30; border: 3px solid #0b110d; box-shadow: inset 0 0 0 2px #4d6355; cursor: pointer;
  }
  .recipe:hover:not(:disabled) { background: #3b4a40; }
  .recipe:disabled { opacity: 0.4; cursor: default; }
  .recipe:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .recipe img { width: 26px; height: auto; image-rendering: pixelated; flex: none; }
  .recipe .arr { color: var(--accent); margin: 0 2px; }
  .recipe .res { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .held { min-height: 20px; font: 700 14px var(--display); color: var(--muted); }
  .held b { color: var(--text); }

  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .btn:disabled { opacity: 0.65; cursor: wait; }
  </style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="info"></div>
    <div id="stats" hidden>
      <div class="stat-bar">HP <div class="bar-fill"><i id="hpFill"></i></div></div>
      <div class="stat-bar">Lapar <div class="bar-fill"><i id="foodFill"></i></div></div>
    </div>
    <div id="topbtns">
      <button class="chip" id="invBtn" type="button">Tas</button>
      <button class="chip" id="menuBtn" type="button">Menu</button>
    </div>
    <div id="wet" hidden></div>
    <div id="cross"></div>
    <div id="toast"></div>
  </div>

  <div id="touch" hidden>
    <div id="dpad">
      <button class="dp" id="dpUp" type="button" aria-label="Maju"></button>
      <button class="dp" id="dpLeft" type="button" aria-label="Kiri"></button>
      <button class="dp" id="dpJump" type="button" aria-label="Jongkok">Jongkok</button>
      <button class="dp" id="dpRight" type="button" aria-label="Kanan"></button>
      <button class="dp" id="dpDown" type="button" aria-label="Mundur"></button>
    </div>
    <div id="actions">
      <button class="act" id="placeBtn" type="button">Taruh</button>
      <button class="act" id="breakBtn" type="button">Hancurkan</button>
      <button class="act big" id="jumpBtn" type="button">Lompat</button>
    </div>
  </div>

  <div id="hotbar"><div class="bar" id="bar"></div></div>

  <div id="inv" hidden>
    <div class="panel invpanel">
      <h2>Tas</h2>
      <div id="palWrap"><h3>Semua balok (mode kreatif)</h3><div class="grid" id="palette"></div></div>
      <div class="grid" id="invGrid"></div>
      <h3>Hotbar</h3>
      <div class="grid" id="invHot"></div>
      <div id="craftWrap"><h3>Meracik</h3><div class="recipes" id="recipes"></div></div>
      <div class="held" id="held"></div>
      <div class="row">
        <button class="btn" id="invTrash" type="button">Buang</button>
        <button class="btn primary" id="invClose" type="button">Tutup</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1>Blokland</h1>
      <div class="strip"><i style="background:var(--grass)"></i><i style="background:var(--dirt)"></i><i style="background:var(--stone)"></i><i style="background:var(--sand)"></i></div>
      <p class="lead">Jelajahi dunia balok acak tanpa batas. Perubahan tersimpan otomatis.</p>
      <button class="btn primary" id="playBtn" type="button" disabled>Memuat…</button>
      <div class="row">
        <button class="btn" id="newBtn" type="button">Dunia baru</button>
        <button class="btn" id="modeBtn" type="button">Mode: Bertahan</button>
      </div>
      <div class="row">
        <button class="btn" id="exportBtn" type="button">Ekspor Dunia</button>
        <button class="btn" id="importBtn" type="button">Impor Dunia</button>
      </div>
      <input type="file" id="importFile" accept=".json" hidden>
      <div class="help">
        <section>
          <h2>Kontrol</h2>
          <ul>
            <li>W A SD berjalan, Spasi melompat</li>
            <li>Klik kiri hancurkan, klik kanan taruh</li>
            <li>E membuka tas, Esc membuka menu</li>
          </ul>
        </section>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- Dunia & Blok ---------- */

  };
  var TIER_NAMES = ['kayu', 'batu', 'besi', 'berlian'], TIER_COL = ['#b07f45', '#8f9591', '#e4e4e4', '#4fe3d8'];
  var KIND_NAMES = ['Beliung', 'Kapak', 'Sekop', 'Pedang'], KIND_KEYS = ['pick', 'axe', 'shovel', 'sword'];
  BLOCKS[30] = { name: 'Tongkat', item: true };
  for (var ti = 0; ti < 4; ti++) for (var ki = 0; ki < 4; ki++) {

  }
  var LASTID = 46;
  var TRANS = (function () { var t = []; for (var i = 0; i < 30; i++) t.push(false); t[0] = t[6] = t[8] = t[14] = t[29] = true; return t; })();

        var F = FACES[f], ax = lx + F.n[0], ay = y + F.n[1], az = lz + F.n[2], nb;
        if (ay < 0) nb = STONE; else if (ay >= H) nb = AIR;
        else if (ax >= 0 && ax < CH && az >= 0 && az < CH) nb = data[(ay * CH + az) * CH + ax];
        else nb = getBlock(x0 + ax, ay, z0 + az);
        if (isW ? (nb !== WATER && !TRANS[nb]) : !TRANS[nb]) continue;
        var tile = def[F.k] || 0;
        var u0 = tile / TILES + 0.0004, u1 = (tile + 1) / TILES - 0.0004;
        for (i = 0; i < 4; i++) {
          T.pos.push(lx + F.v[i][0], y + F.v[i][1], lz + F.v[i][2]);
          T.nor.push(F.n[0], F.n[1], F.n[2]);
          T.uv.push(UVS[i][0] ? u1 : u0, UVS[i][1]);
          T.col.push(F.s, F.s, F.s);
        }
        T.idx.push(T.vc, T.vc + 1, T.vc + 2, T.vc, T.vc + 2, T.vc + 3); T.vc += 4;
      }
    }
    return { a: mkGeo(A), w: mkGeo(Wt) };
  }

  var RD = 4;
  function unloadChunk(c) {
    if (c.mesh) { scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh = null; }
    if (c.wmesh) { scene.remove(c.wmesh); c.wmesh.geometry.dispose(); c.wmesh = null; }
    c.built = false;
  }
  function rebuildChunk(c) {
    unloadChunk(c);
    var r = buildGeometry(c);
    if (r.a) { c.mesh = new THREE.Mesh(r.a, material); c.mesh.position.set(c.cx * CH, 0, c.cz * CH); scene.add(c.mesh); }
    if (r.w) { c.wmesh = new THREE.Mesh(r.w, waterMat); c.wmesh.position.set(c.cx * CH, 0, c.cz * CH); scene.add(c.wmesh); }
    c.built = true;
  }
  function rebuildAll() { chunks.forEach(unloadChunk); updateChunks(); }
  function updateChunks() {
    var pcx = Math.floor(player.x / CH), pcz = Math.floor(player.z / CH);
    for (var dx = -RD; dx <= RD; dx++) for (var dz = -RD; dz <= RD; dz++) {
      var c = getChunk(pcx + dx, pcz + dz); if (!c.built) rebuildChunk(c);
    }
  }
  function setBlock(x, y, z, id) {
    var cx = Math.floor(x / CH), cz = Math.floor(z / CH), c = getChunk(cx, cz);
    var lx = x - cx * CH, lz = z - cz * CH, i = (y * CH + lz) * CH + lx;
    c.data[i] = id;
    var m = edits.get(c.key) || new Map(); edits.set(c.key, m); m.set(i, id);
    rebuildChunk(c);
    saveSoon();
  }

  /* ---------- Pemain & Fisika ---------- *//* ---------- Pemain & Fisika ---------- */
  var PW = 0.3, PH = 1.8, EYE = 1.62;
  var player = { x: 0.5, y: 30, z: 0.5, vx: 0, vy: 0, vz: 0, onGround: false, fly: false };
  var yaw = 0, pitch = 0, keys = {}, playing = false, sel = 0, wet = false;

  function topY(x, z) { for (var y = H - 1; y >= 0; y--) if (getBlock(x, y, z) !== AIR) return y; return 0; }
  function spawn() {
    player.x = 0.5; player.z = 0.5; player.y = topY(0, 0) + 1.01;
    player.vx = player.vy = player.vz = 0; yaw = 0; pitch = 0;
  }
  if (!saved) spawn();

  function solid(x, y, z) { return y < 0 ? true : (y >= H ? false : isBlock(getBlock(x, y, z))); }
  function collides(x, y, z) {
    var x0 = Math.floor(x - PW), x1 = Math.floor(x + PW);
    var y0 = Math.floor(y), y1 = Math.floor(y + PH);
    var z0 = Math.floor(z - PW), z1 = Math.floor(z + PW);
    for (var bx = x0; bx <= x1; bx++) for (var by = y0; by <= y1; by++) for (var bz = z0; bz <= z1; bz++) if (solid(bx, by, bz)) return true;
    return false;
  }
  function raycast() {
    var cp = Math.cos(pitch), dir = [-cp * Math.sin(yaw), Math.sin(pitch), -cp * Math.cos(yaw)];
    var ox = player.x, oy = player.y + EYE, oz = player.z;
    for (var t = 0; t <= 6; t += 0.05) {
      var x = Math.floor(ox + dir[0] * t), y = Math.floor(oy + dir[1] * t), z = Math.floor(oz + dir[2] * t);
      if (y >= 0 && y < H && isBlock(getBlock(x, y, z))) {
        return { x: x, y: y, z: z };
      }
    }
    return null;
  }

  /* ---------- Hotbar & Tas ---------- */
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 1200);
  }
  function refreshHotbar() {
    var bar = $('bar'); bar.innerHTML = '';
    for (var i = 0; i < 9; i++) {
      var s = document.createElement('button'); s.className = 'slot' + (i === sel ? ' sel' : '');
      s.innerHTML = '<span class="num">' + (i + 1) + '</span>';
      if (inv[i]) s.innerHTML += '<b>' + BLOCKS[inv[i].id].name[0] + '</b><span class="cnt">' + inv[i].n + '</span>';
      bar.appendChild(s);
    }
  }
  function addItem(id, n) {
    for (var i = 0; i < 36; i++) { if (inv[i] && inv[i].id === id) { inv[i].n += n; refreshHotbar(); return; } }
    for (var j = 0; j < 36; j++) { if (!inv[j]) { inv[j] = { id: id, n: n }; refreshHotbar(); return; } }
  }

  /* ---------- Event Utama & UI ---------- */
  $('playBtn').addEventListener('click', function() { initAudio(); $('overlay').hidden = true; playing = true; });
  $('menuBtn').addEventListener('click', function() { $('overlay').hidden = false; playing = false; saveNow(); });
  $('invBtn').addEventListener('click', function() { $('inv').hidden = !$('inv').hidden; });
  $('invClose').addEventListener('click', function() { $('inv').hidden = true; });
  $('modeBtn').addEventListener('click', function() { creative = !creative; $('modeBtn').textContent = creative ? 'Mode: Kreatif' : 'Mode: Bertahan'; $('stats').hidden = creative; saveSoon(); });
  $('newBtn').addEventListener('click', function() {
    seed = 1 + Math.floor(Math.random() * 99999); edits.clear(); chunks.forEach(unloadChunk); chunks.clear(); spawn(); rebuildAll();
    $('overlay').hidden = true; playing = true; saveNow();
  });

  window.addEventListener('keydown', function(e) {
    if (!playing) return;
    if (e.code === 'KeyE') $('inv').hidden = !$('inv').hidden;
    keys[e.code] = true;
    if (e.code >= 'Digit1' && e.code <= 'Digit9') { sel = parseInt(e.code[5]) - 1; refreshHotbar(); }
  });
  window.addEventListener('keyup', function(e) { keys[e.code] = false; });

  canvas.addEventListener('click', function(e) {
    if (!playing) return;
    initAudio();
    var target = raycast(); if (!target) return;
    if (e.button === 0) {
      var b = getBlock(target.x, target.y, target.z);
      setBlock(target.x, target.y, target.z, AIR);
      playSound('break');
      if (!creative) addItem(b, 1);
    }
  });

  /* Touch Controls setup */
  var isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (isTouch) { $('touch').hidden = false; document.body.classList.add('touch'); }

  var look = { id: null, x: 0, y: 0 };
  canvas.addEventListener('pointerdown', function(e) {
    if (!playing) return;
    look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY;
  });
  canvas.addEventListener('pointermove', function(e) {
    if (!playing || e.pointerId !== look.id) return;
    var dx = e.clientX - look.x, dy = e.clientY - look.y;
    look.x = e.clientX; look.y = e.clientY;
    yaw -= dx * 0.005; pitch -= dy * 0.005;
    pitch = Math.max(-1.55, Math.min(1.55, pitch));
  });
  canvas.addEventListener('pointerup', function(e) { if (e.pointerId === look.id) look.id = null; });

  /* ---------- Loop Utama ---------- */
  var last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;

    if (playing) {
      // Siklus Siang/Malam Otomatis
      gameTime = (gameTime + dt / 240) % 1;
      var lightVal = Math.max(0.08, Math.sin(gameTime * Math.PI * 2));
      var skyColor = new THREE.Color().setHSL(0.6, 0.5, lightVal);
      scene.background = skyColor; scene.fog.color = skyColor;

      // Status Survival (HP & Lapar)
      if (!creative) {
        food = Math.max(0, food - dt * 0.1);
        if (food === 0) hp = Math.max(0, hp - dt * 1.5);
        $('hpFill').style.width = hp + '%';
        $('foodFill').style.width = food + '%';
      }

      // Pergerakan
      var speed = 4.4; player.vx = 0; player.vz = 0;
      var sy = Math.sin(yaw), cy = Math.cos(yaw);
      if (keys.KeyW || keys.ArrowUp) { player.vx -= sy * speed; player.vz -= cy * speed; }
      if (keys.KeyS || keys.ArrowDown) { player.vx += sy * speed; player.vz += cy * speed; }
      if (keys.KeyA || keys.ArrowLeft) { player.vx -= cy * speed; player.vz += sy * speed; }
      if (keys.KeyD || keys.ArrowRight) { player.vx += cy * speed; player.vz -= sy * speed; }

      player.vy -= 26 * dt;
      if (keys.Space && player.onGround) { player.vy = 8.4; player.onGround = false; }

      var ny = player.y + player.vy * dt;
      if (!collides(player.x, ny, player.z)) { player.y = ny; if (player.vy !== 0) player.onGround = false; }
      else { if (player.vy < 0) player.onGround = true; player.vy = 0; }

      var nx = player.x + player.vx * dt;
      if (!collides(nx, player.y, player.z)) player.x = nx;
      var nz = player.z + player.vz * dt;
      if (!collides(player.x, player.y, nz)) player.z = nz;

      updateChunks();
    }

    camera.position.set(player.x, player.y + EYE, player.z);
    camera.rotation.set(pitch, yaw, 0);
    renderer.render(scene, camera);
  }

  function resize() {
    renderer.setSize(app.clientWidth, app.clientHeight, false);
    camera.aspect = app.clientWidth / app.clientHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize(); refreshHotbar(); rebuildAll();
  $('playBtn').disabled = false; $('playBtn').textContent = 'Mainkan';
  $('modeBtn').textContent = creative ? 'Mode: Kreatif' : 'Mode: Bertahan';
  $('stats').hidden = creative;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
